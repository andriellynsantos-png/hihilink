<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WrmLink — Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-icon">W</div>
      </div>
      <h1>WrmLink</h1>
      <p>Crie sua conta escolar</p>

      <input type="text" id="nomeCadastro" placeholder="Seu nome">
      <input type="email" id="emailCadastro" placeholder="E-mail escolar">
      <input type="password" id="senhaCadastro" placeholder="Crie uma senha">

      <button onclick="fazerCadastro()">Criar conta</button>

      <a href="login.html" class="link">Já tenho conta — Entrar</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
